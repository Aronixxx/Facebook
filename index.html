<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiRed - Iniciar sesión</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 15% 15%, #164c91, transparent 40%),
        radial-gradient(circle at 85% 85%, #18265a, transparent 40%),
        #090d19;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
    color: white;
}

.contenedor {
    width: 100%;
    max-width: 420px;
    perspective: 1200px;
}

.tarjeta {
    padding: 35px 25px;
    border-radius: 25px;

    background: linear-gradient(
        145deg,
        #263957,
        #101a2b
    );

    border: 1px solid #45658c;

    box-shadow:
        0 25px 50px #0009,
        inset 0 2px 5px #ffffff22;

    transition: .4s;
}

.tarjeta:hover {
    transform: translateY(-5px) rotateX(2deg);
}

/* LOGO */

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icono {
    width: 75px;
    height: 75px;

    margin: auto;
    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;
    font-weight: bold;

    background: linear-gradient(
        145deg,
        #39a0ff,
        #0750c9
    );

    box-shadow:
        0 10px 25px #006aff66,
        inset 0 3px 5px #ffffff55;
}

.logo h1 {
    color: #65b1ff;
    margin-top: 15px;
    font-size: 32px;
}

.logo p {
    color: #a8bad3;
    font-size: 13px;
    margin-top: 7px;
}

/* TITULOS */

h2 {
    text-align: center;
    margin-bottom: 12px;
}

.descripcion {
    text-align: center;
    color: #aebbd0;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
}

/* CAMPOS */

.campo {
    margin-bottom: 20px;
}

.campo label {
    display: block;
    color: #b8c9e2;
    font-size: 13px;
    margin-bottom: 9px;
}

.campo input {
    width: 100%;
    padding: 15px;

    border-radius: 12px;
    border: 1px solid #405779;

    background: #101a2b;
    color: white;

    font-size: 15px;
    outline: none;
}

.campo input:focus {
    border-color: #2688ff;
    box-shadow: 0 0 12px #1877f255;
}

.campo input::placeholder {
    color: #7589a5;
}

/* CONTRASEÑA */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.mostrar {
    position: absolute;

    right: 12px;
    top: 50%;

    transform: translateY(-50%);

    border: none;
    background: transparent;

    color: #65b1ff;
    cursor: pointer;

    font-size: 19px;
}

/* BOTONES */

.boton {
    width: 100%;
    padding: 15px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #258bff,
        #0754ce
    );

    color: white;
    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 20px #006aff55;

    transition: .3s;
}

.boton:hover {
    transform: translateY(-3px);
}

.registro {
    background: linear-gradient(
        135deg,
        #22a66b,
        #087b48
    );
}

/* ENLACES */

.enlaces {
    text-align: center;
    margin-top: 20px;
}

.enlaces a {
    color: #65b1ff;
    font-size: 13px;
    text-decoration: none;
}

.separador {
    height: 1px;
    background: #344967;
    margin: 25px 0;
}

/* MENSAJES */

#resultado {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
}

.exito {
    color: #45e69b;
}

.error {
    color: #ff7373;
}

.pie {
    text-align: center;
    color: #71819b;
    font-size: 11px;
    margin-top: 25px;
    line-height: 1.8;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="tarjeta">

    <div class="logo">

        <div class="logo-icono">M</div>

        <h1>MiRed</h1>

        <p>Tu comunidad, tu conexión.</p>

    </div>

    <h2>Iniciar sesión</h2>

    <p class="descripcion">
        Ingresa a tu cuenta para continuar.
    </p>

    <form id="loginForm">

        <div class="campo">

            <label>Correo electrónico o celular</label>

            <input
                type="text"
                id="identificador"
                placeholder="Correo o número celular"
                autocomplete="username"
                required
            >

        </div>

        <div class="campo">

            <label>Contraseña</label>

            <div class="password-box">

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Introduce tu contraseña"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="mostrar"
                    id="mostrar"
                    aria-label="Mostrar contraseña"
                >
                    👁
                </button>

            </div>

        </div>

        <button
            type="submit"
            class="boton"
            id="entrar"
        >
            Iniciar sesión
        </button>

    </form>

    <div class="enlaces">

        <a href="#" id="recuperar">
            ¿Olvidaste tu contraseña?
        </a>

    </div>

    <div class="separador"></div>

    <button
        class="boton registro"
        id="crearCuenta"
    >
        Crear cuenta nueva
    </button>

    <div id="resultado"></div>

    <div class="pie">

        🔒 Protección de datos MiRed.

        <br>

        Tus credenciales se mantienen protegidas.

        <br><br>

        © 2026 MiRed. Todos los derechos reservados.

    </div>

</div>

</div>

<script>

// MOSTRAR Y OCULTAR CONTRASEÑA

const contrasena =
document.getElementById("contrasena");

document.getElementById("mostrar")
.addEventListener("click", function() {

    if (contrasena.type === "password") {

        contrasena.type = "text";
        this.textContent = "🙈";

    } else {

        contrasena.type = "password";
        this.textContent = "👁";

    }

});


// VALIDAR FORMULARIO

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const identificador =
    document.getElementById("identificador")
    .value.trim();

    const clave = contrasena.value;

    const resultado =
    document.getElementById("resultado");

    const esCorreo =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(identificador);

    const esCelular =
    /^\+?[0-9]{8,15}$/
    .test(identificador);

    if (!esCorreo && !esCelular) {

        resultado.innerHTML =
        '<span class="error">Ingresa un correo o número válido.</span>';

        return;

    }

    if (clave.length < 6) {

        resultado.innerHTML =
        '<span class="error">La contraseña debe tener al menos 6 caracteres.</span>';

        return;

    }

    resultado.innerHTML =
    '<span class="exito">Formulario validado. El siguiente paso es verificar la cuenta mediante el servidor de autenticación.</span>';

});


// RECUPERAR CONTRASEÑA

document.getElementById("recuperar")
.addEventListener("click", function(e) {

    e.preventDefault();

    alert(
        "La recuperación estará disponible cuando se conecte el sistema de autenticación."
    );

});


// CREAR CUENTA

document.getElementById("crearCuenta")
.addEventListener("click", function() {

    alert(
        "El registro estará disponible al conectar la base de datos."
    );

});

</script>

</body>
</html>
