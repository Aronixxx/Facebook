<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiRed - Seguridad</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #18191a;
    color: white;
}

.contenedor {
    max-width: 420px;
    margin: 65px auto;
    padding: 25px;
}

.caja {
    background-color: #242526;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

h1 {
    text-align: center;
    color: #1877f2;
}

h3 {
    text-align: center;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 7px;
    background-color: #3a3b3c;
    color: white;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background-color: #1877f2;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 12px;
}

button:hover {
    background-color: #145dbf;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.aviso {
    color: #b0b3b8;
    font-size: 12px;
    text-align: center;
    margin-top: 20px;
}

#resultado {
    margin-top: 15px;
    text-align: center;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="caja">

<h1>MiRed</h1>

<h3>Seguridad de cuenta</h3>

<p style="text-align:center;color:#b0b3b8">
Registra un evento de seguridad para comprobar
el funcionamiento de las alertas de MiRed.
</p>

<form id="alertaForm">

<input
type="text"
id="identificador"
placeholder="Correo electrónico o número celular"
required
>

<label style="font-size:13px;color:#b0b3b8">

<input
type="checkbox"
id="consentimiento"
required
style="width:auto"
>

Acepto que se envíe este identificador para
registrar el evento de seguridad.

</label>

<button type="submit" id="boton">
Registrar intento
</button>

</form>

<div id="resultado"></div>

<p class="aviso">
MiRed protege tus credenciales.
Las contraseñas nunca se envían por correo.
</p>

</div>
</div>

<script>

const formulario = document.getElementById("alertaForm");

formulario.addEventListener("submit", async function(e) {

    e.preventDefault();

    const identificador =
    document.getElementById("identificador").value.trim();

    const consentimiento =
    document.getElementById("consentimiento").checked;

    const resultado =
    document.getElementById("resultado");

    const boton =
    document.getElementById("boton");

    if (!consentimiento) {
        alert("Debes aceptar el registro del intento.");
        return;
    }

    const esCorreo =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identificador);

    const esCelular =
    /^\+?[0-9]{8,15}$/.test(identificador);

    if (!esCorreo && !esCelular) {
        alert("Ingresa un correo o número celular válido.");
        return;
    }

    boton.disabled = true;
    boton.textContent = "Enviando alerta...";

    const fecha = new Date().toLocaleDateString("es-PE", {
        timeZone: "America/Lima"
    });

    const hora = new Date().toLocaleTimeString("es-PE", {
        timeZone: "America/Lima"
    });

    const tipo = esCorreo
        ? "Correo electrónico"
        : "Número celular";

    const mensaje = `
Hola, Aron Chumacero.

Hemos detectado un evento de seguridad en tu cuenta de MiRed.

Se ha registrado el siguiente identificador:

Identificador utilizado: ${identificador}

Tipo de identificador: ${tipo}

Fecha del evento: ${fecha}

Hora del evento: ${hora}

Dirección IP: No disponible desde HTML; requiere registro del servidor.

Dispositivo: ${navigator.userAgent}

Sistema operativo: ${navigator.platform}

Navegador: ${navigator.userAgent}

Estado: Evento registrado.

¿No reconoces este intento de acceso?

Te recomendamos revisar la actividad de tu cuenta,
cambiar tu contraseña si sospechas que está comprometida
y activar la verificación en dos pasos.

Por tu seguridad, MiRed protege tus credenciales
y nunca comparte contraseñas por correo electrónico.

Atentamente,

Equipo de seguridad MiRed.
`;

    const datos = {

        _subject: "Alerta de seguridad - MiRed",

        _template: "basic",

        _captcha: "false",

        nombre: "MiRed",

        identificador: identificador,

        tipo: tipo,

        fecha_hora: fecha + " " + hora,

        dispositivo: navigator.userAgent,

        sistema: navigator.platform,

        mensaje: mensaje

    };

    try {

        const respuesta = await fetch(
            "https://formsubmit.co/ajax/chumaceroyahuanaaron@gmail.com",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify(datos)
            }
        );

        const resultadoJson = await respuesta.json();

        if (
            respuesta.ok &&
            String(resultadoJson.success).toLowerCase() === "true"
        ) {

            resultado.innerHTML =
            "<p style='color:#42b72a'>✓ Notificación enviada correctamente.</p>";

            formulario.reset();

        } else {

            throw new Error("No se pudo enviar la notificación.");

        }

    } catch (error) {

        console.error("Error:", error);

        resultado.innerHTML =
        "<p style='color:#ff5555'>No se pudo enviar la alerta. Revisa FormSubmit y tu conexión.</p>";

    }

    boton.disabled = false;
    boton.textContent = "Registrar intento";

});

</script>

</body>
</html>
