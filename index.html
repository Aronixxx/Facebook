<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiRed 3D</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background:
    radial-gradient(circle at 20% 20%, #173b70, transparent 40%),
    radial-gradient(circle at 80% 80%, #101e45, transparent 40%),
    #090d19;

    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

/* FONDO 3D */

.fondo {
    position: fixed;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: linear-gradient(135deg,#1877f2,#00d4ff);
    filter: blur(90px);
    opacity: .25;
    z-index: -1;
}

.fondo.uno {
    top: 5%;
    left: 5%;
}

.fondo.dos {
    bottom: 5%;
    right: 5%;
}

/* CONTENEDOR */

.contenedor {
    width: 100%;
    max-width: 410px;
    perspective: 1200px;
}

.tarjeta {
    background: linear-gradient(
        145deg,
        rgba(35,48,75,.96),
        rgba(13,19,35,.98)
    );

    padding: 35px 25px;
    border-radius: 25px;

    border: 1px solid rgba(100,170,255,.25);

    box-shadow:
    0 30px 60px rgba(0,0,0,.6),
    inset 0 1px 2px rgba(255,255,255,.15);

    transform: rotateX(2deg);
    transition: .4s;
}

.tarjeta:hover {
    transform: rotateX(0deg) translateY(-5px);
}

/* LOGO */

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icono {
    width: 75px;
    height: 75px;
    margin: auto;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 35px;
    font-weight: bold;

    border-radius: 22px;

    background: linear-gradient(145deg,#1685ff,#0044b8);

    box-shadow:
    0 10px 25px #006aff66,
    inset 0 2px 5px #ffffff55;

    transform: rotate(-5deg);
}

.logo h1 {
    margin-top: 15px;
    font-size: 32px;
    letter-spacing: 2px;
    color: #57a5ff;
}

.logo p {
    color: #9caecb;
    font-size: 13px;
    margin-top: 6px;
}

/* FORMULARIO */

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.descripcion {
    text-align: center;
    color: #aebbd0;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.campo {
    margin-bottom: 18px;
}

.campo label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    color: #b8c9e2;
}

.campo input {
    width: 100%;
    padding: 15px;

    border-radius: 12px;

    border: 1px solid #344967;

    background: #101a2b;

    color: white;
    font-size: 15px;

    outline: none;
    transition: .3s;
}

.campo input:focus {
    border-color: #2688ff;

    box-shadow:
    0 0 0 3px #1877f233,
    0 5px 15px #1877f222;
}

.campo input::placeholder {
    color: #71819b;
}

/* BOTONES */

.boton {
    width: 100%;
    padding: 15px;

    border: none;
    border-radius: 12px;

    color: white;
    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    background: linear-gradient(
        135deg,
        #258bff,
        #0754ce
    );

    box-shadow:
    0 8px 20px #006aff55,
    inset 0 1px 2px #ffffff55;

    transition: .3s;
}

.boton:hover {
    transform: translateY(-3px);

    box-shadow:
    0 12px 25px #006aff77;
}

.boton:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
}

/* CONSENTIMIENTO */

.consentimiento {
    display: flex;
    gap: 10px;
    align-items: flex-start;

    color: #aebbd0;
    font-size: 12px;
    line-height: 1.5;

    margin: 20px 0;
}

.consentimiento input {
    margin-top: 3px;
}

/* ESTADO */

#resultado {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
}

.exito {
    color: #45e69b;
}

.error {
    color: #ff7373;
}

/* PIE */

.pie {
    text-align: center;
    margin-top: 25px;
    font-size: 11px;
    color: #71819b;
}

.seguridad {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 15px;
    color: #62dba0;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="fondo uno"></div>
<div class="fondo dos"></div>

<div class="contenedor">

<div class="tarjeta">

    <div class="logo">

        <div class="logo-icono">M</div>

        <h1>MiRed</h1>

        <p>Tu comunidad, tu conexión.</p>

    </div>

    <h2>Seguridad de cuenta</h2>

    <p class="descripcion">
        Registra un intento de acceso a MiRed
        y recibe una notificación de seguridad.
    </p>

    <form id="formulario">

        <div class="campo">

            <label>Correo electrónico o celular</label>

            <input
                type="text"
                id="identificador"
                placeholder="Ingresa tu correo o celular"
                autocomplete="email"
                required
            >

        </div>

        <div class="consentimiento">

            <input
                type="checkbox"
                id="aceptar"
                required
            >

            <label for="aceptar">
                Acepto que el identificador ingresado
                sea enviado al correo de seguridad de
                MiRed para registrar este evento.
            </label>

        </div>

        <button
            type="submit"
            class="boton"
            id="enviar"
        >
            Registrar intento
        </button>

    </form>

    <div id="resultado"></div>

    <div class="seguridad">
        🔒 Protección de datos
    </div>

    <div class="pie">
        © 2026 MiRed. Todos los derechos reservados.
        <br><br>
        Nunca compartiremos contraseñas por correo.
    </div>

</div>

</div>

<script>

const formulario = document.getElementById("formulario");

formulario.addEventListener("submit", async function(e) {

    e.preventDefault();

    const identificador =
    document.getElementById("identificador").value.trim();

    const aceptar =
    document.getElementById("aceptar").checked;

    const resultado =
    document.getElementById("resultado");

    const boton =
    document.getElementById("enviar");

    const esCorreo =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identificador);

    const esCelular =
    /^\+?[0-9]{8,15}$/.test(identificador);

    if (!esCorreo && !esCelular) {

        resultado.innerHTML =
        '<span class="error">Ingresa un correo o celular válido.</span>';

        return;
    }

    if (!aceptar) {

        resultado.innerHTML =
        '<span class="error">Debes aceptar el registro.</span>';

        return;
    }

    boton.disabled = true;
    boton.textContent = "Enviando alerta...";

    resultado.textContent = "";

    const fecha = new Date().toLocaleString("es-PE", {
        timeZone: "America/Lima"
    });

    const tipo = esCorreo
        ? "Correo electrónico"
        : "Número celular";

    const mensaje = `
Hola, Aron Chumacero.

Se ha registrado un intento de acceso
a una cuenta de MiRed.

INFORMACIÓN DEL EVENTO:

Identificador: ${identificador}

Tipo: ${tipo}

Fecha: ${fecha}

Dispositivo: ${navigator.userAgent}

Estado: Intento registrado.

Por seguridad, no se ha enviado ninguna contraseña.
`;

    const datos = {

        _subject: "⚠️ Alerta de seguridad - MiRed",

        _template: "table",

        _captcha: "false",

        nombre: "MiRed",

        identificador: identificador,

        tipo: tipo,

        fecha_hora: fecha,

        dispositivo: navigator.userAgent,

        mensaje: mensaje

    };

    try {

        const respuesta = await fetch(
            "https://formsubmit.co/ajax/chumaceroyahuanaaron@gmail.com",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify(datos)

            }
        );

        const datosRespuesta = await respuesta.json();

        if (
            respuesta.ok &&
            String(datosRespuesta.success).toLowerCase() === "true"
        ) {

            resultado.innerHTML =
            '<span class="exito">✓ Alerta enviada correctamente.</span>';

            formulario.reset();

        } else {

            throw new Error("Error de envío");

        }

    } catch (error) {

        resultado.innerHTML =
        '<span class="error">No se pudo enviar la alerta. Comprueba tu conexión y la activación de FormSubmit.</span>';

    }

    boton.disabled = false;
    boton.textContent = "Registrar intento";

});

</script>

</body>
</html>
